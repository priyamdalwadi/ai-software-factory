name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked
      - name: Lint and formatting
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Types
        run: uv run --locked mypy
      - name: API and persistence tests
        run: uv run --locked pytest -q
      - name: Browser script syntax
        run: node --check src/dayboard/static/app.js
      - name: Build installable package
        run: uv build

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked
      - name: Application security patterns
        run: uv run --locked bandit -r src -ll
      - name: Dependency vulnerabilities
        run: |
          uv export --locked --no-emit-project --format requirements-txt --output-file audit-requirements.txt --quiet
          uv run --locked pip-audit --requirement audit-requirements.txt --strict --disable-pip

  gate:
    name: ci-gate
    needs: [quality, security]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Both prerequisite jobs must succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          test "$QUALITY" = "success"
          test "$SECURITY" = "success"
