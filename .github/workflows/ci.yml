name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install dependency manager
        run: python -m pip install uv==0.13.6
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Type check application
        run: uv run --locked mypy
      - name: Unit and integration tests
        run: uv run --locked pytest -q
      - name: Build package
        run: uv build

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install dependency manager
        run: python -m pip install uv==0.13.6
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Static Python security checks
        run: uv run --locked bandit -r src -ll
      - name: Export dependency inventory
        run: uv export --locked --no-emit-project --format requirements-txt --output-file audit-requirements.txt
      - name: Audit known dependency vulnerabilities
        run: uv run --locked pip-audit --requirement audit-requirements.txt --strict --disable-pip

  gate:
    name: ci-gate
    needs: [quality, security]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
